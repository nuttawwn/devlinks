<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tao — Links</title>
  <meta name="description" content="Tao (เต่า) — Full Stack Developer. Portfolio, GitHub, LinkedIn and contact.">
  <!-- Social preview (crawlers don't run JS, so these stay static — edit them by hand) -->
  <meta property="og:title" content="Tao — Full Stack Developer">
  <meta property="og:description" content="Portfolio, GitHub, LinkedIn and contact.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='5' y='22' font-family='monospace' font-size='16' font-weight='700' fill='%233fb950'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="dl-page">
  <main id="app" aria-live="polite">
    <p class="dl-loading">loading</p>
  </main>

  <script src="assets/render.js"></script>
  <script>
    (function () {
      var app = document.getElementById('app');
      // Cache-bust so edits saved from the admin page show up as soon as Pages redeploys.
      fetch('links.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          DevLinks.render(data, app);
          var p = data.profile || {};
          if (p.name) document.title = p.name + (p.role ? ' — ' + p.role : '');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0d1117');
        })
        .catch(function (err) {
          app.innerHTML = '';
          var msg = document.createElement('p');
          msg.className = 'dl-loading';
          msg.textContent = 'error: could not load links.json (' + err.message + ')';
          app.appendChild(msg);
        });
    })();
  </script>
</body>
</html>
